[package]
name = "rust_async_event_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_async_event_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.2", features = ["extension-module","chrono"] }
tokio = { version = "1.49.0", features = ["full"] }
chrono = "0.4.44"
log = "0.4.29"
parking_lot = "0.12.5"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
